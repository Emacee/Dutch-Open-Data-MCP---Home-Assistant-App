name: "Dutch Open Data MCP"
version: "1.0.0"
slug: "dutch_open_data_mcp"
description: >-
  Serve 46 Dutch government open-data sources (CBS, KNMI, RDW, Tweede Kamer,
  PDOK/BAG, Rechtspraak, Rijkswaterstaat and more) to AI assistants as an
  MCP server, from your own Home Assistant. Works locally, or publicly via
  your own reverse proxy or Cloudflare Tunnel. Access needs a bearer token,
  with OAuth (dynamic registration + PKCE) for clients such as the Claude
  mobile apps that offer no header field. Per-source API keys are optional:
  a source you have not configured is left out of the tool list entirely
  rather than failing when an assistant calls it.
url: "https://github.com/Emacee/Dutch-Open-Data-MCP---Home-Assistant-App"
arch:
  - aarch64
  - amd64
init: false
# Ingress serves the status dashboard (see app/gateway.mjs) on its own
# internal-only port — deliberately NOT listed under `ports` below, so it
# is reachable only through Home Assistant's authenticated ingress proxy,
# never directly or through the Cloudflare Tunnel. The app additionally
# rejects any connection that does not come from the Supervisor proxy.
# Note panel_admin only hides the sidebar entry from non-admins; it does
# not restrict the ingress URL, which is why secrets are hidden there by
# default (see show_secrets_in_ui).
ingress: true
ingress_port: 8099
panel_icon: mdi:bank
panel_title: Dutch Open Data
panel_admin: true
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: >-
    MCP Streamable HTTP (POST/GET/DELETE /mcp) and legacy SSE (GET /sse,
    POST /messages). Point a Cloudflare Tunnel public hostname at
    http://<this host>:8098 — a dedicated subdomain (not a path under an
    existing hostname) is strongly recommended, see DOCS.md.
startup: application
boot: auto
# hassio_api is needed to write back into this add-on's own Configuration
# via POST /addons/self/options: run.sh stores the auto-generated bearer
# token that way, and the ingress dashboard saves API keys the same way so
# both land in Supervisor's options rather than a separate copy. The
# dashboard's restart button uses POST /addons/self/restart. Nothing else
# in the Supervisor API is touched.
hassio_api: true
homeassistant_api: false
options:
  # The public URL your MCP clients will use, e.g.
  # https://nlgov-mcp.example.com/mcp. Shown on the dashboard for easy
  # copying, and used as the issuer in the OAuth discovery documents
  # instead of trusting the request's Host header. Leave blank if you are
  # not exposing this add-on publicly.
  mcp_url: ""
  # Left blank on purpose: no secret belongs in this (or any) git repo.
  # run.sh generates a random one on first start and saves it back here
  # via the Supervisor API, so it shows up in the Configuration tab
  # without ever being committed. Set your own value here to override it.
  mcp_auth_token: ""
  timezone: "Europe/Amsterdam"
  log_level: "info"
  # Home Assistant Ingress authenticates the visitor but does not tell the
  # add-on who they are, and it is reachable by every logged-in user, not
  # just admins. Off by default, the dashboard therefore never renders the
  # bearer token or API keys: keys can be set there but not read back.
  # Turn this on only if every Home Assistant user on this install is
  # trusted with those secrets.
  show_secrets_in_ui: false
  api_keys:
    knmi_api_key: ""
    overheid_api_key: ""
    bag_api_key: ""
    dso_api_key: ""
    ned_api_key: ""
    ep_online_api_key: ""
    ns_api_key: ""
    dnb_api_key: ""
schema:
  # str, not url: the Home Assistant Companion (mobile) app's config form
  # doesn't handle the `url` schema type correctly — it silently drops the
  # field and shifts its value into a different field entirely (observed:
  # the mcp_url value ended up saved under api_keys.ned_api_key, and the
  # save was then rejected for missing mcp_url). str is universally
  # supported and this field is display-only anyway, so no validation is
  # lost that mattered. Also made optional so a client mishandling it can
  # never hard-block a save again.
  mcp_url: str?
  mcp_auth_token: password?
  timezone: str
  log_level: list(debug|info|warning|error)
  show_secrets_in_ui: bool
  api_keys:
    knmi_api_key: password?
    overheid_api_key: password?
    bag_api_key: password?
    dso_api_key: password?
    ned_api_key: password?
    ep_online_api_key: password?
    ns_api_key: password?
    dnb_api_key: password?
